# SloppyMod Mending Solutions - the only file in Tools/ that differs between
# mods. Everything else here is shared verbatim across the SloppyMod repos.

name      = SloppyMods Mending Solutions
folder    = SloppyModMending
namespace = MendingMod
assembly  = MendingMod
source    = Source/MendingMod
series    = 0.9

# No `prefix` line on purpose: this mod's defNames have no common prefix
# (DoMend, TableMending_Manual, AutomatedMender, BasicMending...), so the
# validator cannot tell one of ours that matches nothing from a vanilla def.
# The reference checks that need a prefix are skipped here; point validate.py
# at RIMWORLD_CORE_DEFS to cover the same ground.

# <output dir> <RimWorld ref version> [compile-time defines]
build     = Assemblies 1.6.4871

# Must be in the release zip.
require   = About/About.xml
require   = Defs
require   = Languages
require   = Textures
